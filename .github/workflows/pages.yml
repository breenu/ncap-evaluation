# Renders the committed, precomputed dashboard sources (dashboard/) with Quarto and deploys them to GitHub Pages
# (Phase 9 Part B; DEC-198 to DEC-201). Quarto comes from the separate site lock (envs/site-lock.yml), never from
# the analysis lock. No code runs at render time and no data is fetched: every page is plain Markdown.
# Needs Settings -> Pages -> Source: "GitHub Actions" (until then the deploy job fails, which is expected).
name: dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "envs/site*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/site-lock.yml
          environment-name: ncap-site
          cache-environment: true

      - name: Render the site
        run: |
          quarto --version
          quarto render dashboard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
