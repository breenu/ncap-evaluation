# Region of each satellite unit / urban centre (src/clean/regions.py), final in Phase 3 (DEC-075).
# Used for seasonal cycles by region (proposal stage 4), the region x year effects (stage 7) and the
# IGP / coastal moderators (stage 8). Assigned per urban centre, not per state, in this order:
#   1. north-east  centre in a north-eastern state
#   2. igp         centre in an IGP-plains state AND mean elevation (UCDB GE_ELV_AVG_2025) below
#                  igp_max_elevation_m: the plain, without the Himalayan foothills and hills
#                  (Darjeeling 1,393 m, Dehradun 654 m, Rishikesh 365 m out; Chandigarh 323 m,
#                  Haridwar 293 m in)
#   3. coastal     polygon within coastal_max_km of the Natural Earth 1:10m coastline
#   4. peninsular/other  everything else (peninsula, Rajasthan, Gujarat inland, central India,
#                  Himalayan and J&K centres). Kept as one group, as in the proposal; splitting out
#                  Himalayan centres is a sensitivity option in docs/analysis_plan.md.

igp_states:        # Jharkhand is left out: it lies on the Chota Nagpur plateau, not the plain
  - Punjab
  - Haryana
  - Chandigarh
  - Delhi
  - Uttar Pradesh
  - Bihar
  - West Bengal
  - Uttarakhand     # only its plains centres pass the elevation rule (e.g. Haridwar, Roorkee)

igp_max_elevation_m: 350

northeast_states:
  - Arunachal Pradesh
  - Assam
  - Manipur
  - Meghalaya
  - Mizoram
  - Nagaland
  - Sikkim
  - Tripura

coastal_max_km: 50   # sea-breeze reach; distance from the centre's polygon edge to the coastline
