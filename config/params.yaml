# Analysis parameters. Code reads thresholds from here, never from literals.
# Every value comes from the proposal or docs/DECISIONS.md.
# null = not decided yet. The stage that first needs it sets it, with a DECISIONS entry, before running.

seed: 20260926

windows:
  ground_start: "2015-01-01"
  ground_end: "2026-03-31"            # DEC-011: completes FY2025-26
  satellite_download_years: [2005, 2024]   # DEC-003
  satellite_analysis_years: [2010, 2024]   # docs/analysis_plan.md §3 (DEC-084); nine pre-years
  ncap_launch_year: 2019              # proposal: NCAP launched January 2019

mirror:                               # CPCB mirror (DEC-037); evidence in docs/mirror-checks.md
  # The mirror stores Indian wall-clock times stamped as UTC (its parse.py uses
  # replace_time_zone("UTC")), so a stored instant is 5.5 h ahead of true UTC. Measured against the
  # stored instant read with DuckDB TimeZone='UTC' (exact 15-minute matches with OpenAQ; solar cycle;
  # ERA5). Replaces DEC-040's "11 h", which was the same offset measured on timestamps rendered in
  # this laptop's local zone (IST, +5.5 h) (DEC-054). Raw files are not changed; ingest subtracts this.
  stored_minus_utc_hours: 5.5

pollutants:
  primary: [pm25, pm10]
  secondary: [no2]                    # secondary check only (proposal, "what not to do")

satellite:
  primary: V5GL06                     # DEC-001
  comparison: V6GL03                  # DEC-002
  vintage: V6GL0204                   # DEC-002
  region: Asia
  zonal_weighting: population         # primary, all units (DEC-070); area-weighted = sensitivity

completeness:                         # proposal stage 3
  min_hour_share_per_day: 0.75
  min_day_share_per_year: 0.75
  sensitivity: [0.60, 0.90]           # proposal validation table
  # an hour counts if it has at least this many valid 15-minute values (DEC-069, Reenu):
  min_quarters_per_hour: 1            # primary: any quarter-hour present
  min_quarters_per_hour_sensitivity: 3

flags:                                # proposal stage 3; values set in Phase 3 from the data (DEC-068)
  flatline_min_hours: 4               # runs of 2-3 identical hourly means occur at chance rates; 4+ do not
  ceiling_detect:                     # instrument ceilings found from the value histogram, not typed in
    min_value: 500                    # ug/m3
    excess: 10                        # count > 10 x median count of same-precision values within +-window
    window: 10                        # ug/m3
    min_stations: 5                   # a ceiling is a network-wide pin, not one stuck analyser
    min_count: 500
  pm25_gt_pm10_tolerance:             # separate analysers: allow max(abs, rel x PM10) of noise
    abs_ugm3: 5
    rel: 0.10
  neighbour_radius_km: 25             # same airshed; 59% of located stations have >= 2 neighbours (DEC-071)
  robust_z: 3                         # spatial checks: flag beyond 3 robust SDs of that year's network
  changepoint_penalty_grid: [3, 5, 8, 10, 15, 20]   # x log(n); calibrated against a block-shuffled null (DEC-078)
  changepoint_false_alarm: 0.05       # the chosen penalty is the smallest with <= 5% false alarms
  changepoint_min_shift: 0.223        # log units: only steps of >= 25% count as level shifts
  near_constant:                      # stuck / over-smoothed analysers (DEC-110; a deviation added in Phase 5)
    window_days: 15                   # centred rolling SD of daily log PM over 15 calendar days...
    min_days: 10                      # ...with at least 10 valid days in the window
    calibration_quantile: 0.001       # thresholds = this quantile among days of clearly working stations
    min_region_stations: 20           # S per region if it has this many working stations, else national
    normal_min_neighbour_corr: 0.8    # "clearly working": the station-year tracks its neighbours this well
    min_flag_days_per_year: 30        # a station-year is flagged with >= 30 flagged days (a stuck month)

# Stations to name wherever they contribute to a result (DEC-121): no override, only visibility.
watch_stations: [site_1433]           # Satna, Bandhavgar Colony: PM2.5 far below the satellite 2018-22
# Post-hoc sensitivity, ADDED AFTER INSPECTING THE DATA (DEC-124): wherever results use the registered
# rules only (rule = registered_flags) and these stations contribute, they are also computed without them.
posthoc_drop_registered: [site_1433]

reliability:                          # src/clean/reliability.py (DEC-073)
  check_penalty: 0.8                  # score multiplied by this for each failed check

control_pool:
  min_population: 100000              # 2015 population (pre-treatment epoch); analysis_plan.md §2
  spillover_buffer_km: 25             # sensitivity only: drop controls within 25 km of an NCAP place (DEC-085)
  spillover_buffer_report_km: [10, 25, 50]   # pool sizes shown in docs/pregate_checks.md

deweathering:                         # proposal stage 5; plan section 4, Phase 5; DEC-100 to DEC-113
  resamples_default: 500              # full run (Reenu, DEC-113): the rule gave 300, only narrowly
  resamples_max: 1000
  # Convergence rule, fixed before the pilot (DEC-103): the smallest N on the grid at which the
  # station-month deweathered mean is within `tol` of its value at resamples_max for >= `share`
  # of pilot station-months (both families, both pollutants).
  convergence_grid: [50, 100, 200, 300, 500, 1000]
  convergence_tol: 0.005
  convergence_share: 0.95
  # Weather resampling (DEC-102). seasonal: each day's weather vector is drawn, whole, from ERA5 days
  # at the station's cell within +- window days of the same day of year, in any year of the pool;
  # the day's own day of year and weekday are kept. annual: Grange & Carslaw's default, drawing
  # weather, day of year and weekday from any day (removes the seasonal cycle).
  resample_scheme: seasonal           # primary (Reenu; a registered-plan deviation, DEC-109)
  resample_schemes_sensitivity: [annual]   # Grange & Carslaw's default, run on the full set (DEC-109)
  resample_window_days: 15
  weather_pool_years: [2015, 2025]    # full calendar years of ERA5 at the cell, the same for every station
  fit_end: "2025-12-31"               # calendar 2025 is the last primary ground year (DEC-079)
  min_fit_days: 365                   # a station-pollutant with fewer valid days is not deweathered
  cv_min_train_days: 365              # a forward-chaining fold needs a year of training days...
  cv_min_test_days: 30                # ...and a month of test days in its test year
  # Trend value used to predict an unseen test year (DEC-107, replacing DEC-103's clamp):
  # last_year = the same calendar day one year earlier (inside the training data);
  # clamp = the last training day (flawed: carries that day's season into the whole year).
  cv_trend: last_year
  # Within-period blocked CV, a diagnostic only (DEC-112; never used to choose the family): calendar
  # months dealt round-robin into K folds; a held-out month's neighbours within `buffer` days are
  # left out of training too. It tests the weather response without extrapolating the trend.
  cv_within_folds: 10
  cv_within_buffer_days: 7
  afternoon_utc_hours: [6, 12]        # 11:30-17:30 IST, for the afternoon BLH maximum
  # A series "diverges" if D > 5%, D = the largest gap over its valid years between the two families'
  # log annual deweathered means, each centred on its own mean over those years (DEC-111).
  divergence_flag_pct: 5
  divergence_min_years: 2             # D needs >= 2 valid station-years (with one, it is 0 by construction)
  workers: 8                          # of 10 cores; one thread per worker (LightGBM n_jobs=1, R BLAS 1)
  lgbm:                               # fixed settings, not tuned per station (DEC-101)
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.9
  gam:                                # mgcv bam, fREML, discrete (DEC-101)
    # Trend rule (DEC-116): annual_knots = cubic regression spline, knots evenly spaced >= 1 year apart
    # (floor(span) + 1 of them; a straight line below 3). k_per_year = the DEC-101 trend, kept as the
    # sensitivity family gam_k4 and for the pilot.
    trend_rule: annual_knots
    trend_k_per_year: 4               # k_per_year: basis size of the trend smooth per year of record
    trend_k_min: 5
    trend_k_max: 45
  pilot:                              # DEC-104
    n_stations: 20
    per_region: 5                     # a region's shortfall goes to the regions with most eligible stations
    min_valid_days: 1095              # both PM2.5 and PM10, so each pilot station tests both
    gam_trend_rule: k_per_year        # the pilot ran with the DEC-101 trend; kept so it rebuilds as run
  # Extrapolation guard (DEC-117): station-years whose deweathered mean is outside these multiples of
  # the raw mean over the same days are flagged (never dropped).
  guard_ratio: [0.67, 1.5]
  # National Covid lockdown (phases 1-4; Unlock 1 from 1 June 2020, MHA/PIB PRID 1627965), Indian days,
  # inclusive. Used by the pre-set smear test (DEC-119): GAM + lockdown indicator on the pilot stations.
  lockdown: ["2020-03-25", "2020-05-31"]
  lockdown_min_days: 10               # the indicator enters a model only with >= 10 lockdown days in its data
  lockdown_test_threshold_pct: 1      # DEC-119: median |change| in 2019/2021 deweathered means above this -> adopt

composition:                          # Phase 6, RQ1 and H4 (DEC-125 to DEC-130)
  baseline_years: [2018, 2019]        # balanced-panel baseline: first = primary, second = sensitivity (DEC-088)
  end_year: 2025                      # last primary ground year (DEC-079)
  satellite_end_year: 2024            # ACAG V5.GL.06 ends in 2024: ground vs satellite runs to here
  bootstrap_draws: 1000               # cluster bootstrap over cities; station bootstrap within a city (DEC-129)
  family_flag_pp: 5                   # family-disagreement diagnostic: |GAM - LightGBM| change > 5 pp (DEC-130)
  diag_draws: 100                     # weather draws per day used to split a model's weather effect by variable
  cold_months: [1, 2, 10, 11, 12]     # "cold months" of a calendar year for the ERA5 summary (DEC-130)

causal:                               # Phase 7, RQ3 (DEC-139 to DEC-150; fixed before any estimate)
  years_drop: [2020]                  # removed from the primary panel before estimation (plan §5)
  placebo_reps: 500                   # joint-placebo replications per SDID specification (DEC-139)
  workers: 8                          # R parallel workers; one BLAS thread each (as DEC-087)
  event_window: [-9, 5]               # relative years reported and aggregated (plan §5 item 2)
  wald_p_min: 0.10                    # rule (b): pre-period coefficients jointly insignificant if p > this
  season_years: [2010, 2023]          # winter 2024 needs Feb 2025, which ACAG does not have (DEC-140)
  target_reductions_pct: [20, 30, 40] # NCAP targets the 95% CI is set against (DEC-135/141)
  honest_mbar: [0, 0.5, 1, 1.5, 2]    # relative-magnitudes grid (plan §5; DEC-143)
  honest_smooth_steps: 5              # smoothness M: 0 to 2 x largest pre-period SE in 5 equal steps
  honest_breakdown_max: 5             # breakdown search upper limit
  honest_breakdown_tol: 0.01          # bisection precision
  cs_biters: 1000                     # did multiplier bootstrap for the uniform bands (DEC-144)
  ground_bootstrap: 1000              # Layer B cluster bootstrap over cities (plan §5 item 4)
  asansol_alone_ucdb: 11080           # Asansol's own GHSL centre, without "Mejia" (DEC-147 item 6)
  himalayan_states: ["Jammu & Kashmir", "Ladakh", "Himachal Pradesh"]   # DEC-147 item 13
  himalayan_min_elevation_m: 350      # IGP-state centres at or above this are foothills/hills (DEC-075)

robustness:                           # proposal validation table
  placebo_year: 2016
  placebo_space_permutations: 500
  # Calibration leakage (DEC-096): treated units split by whether a CAAQMS station inside them first
  # reported PM in the satellite post-period; a group with fewer units than the minimum is not estimated.
  leakage_gain_years: [2019, 2024]
  leakage_min_units: 10
  # Smallest effect of interest for the H1 equivalence test (DEC-095): 5% = a quarter of NCAP's
  # smallest target (20%, set for PM10).
  equivalence_margin_pct: 5

treatment:                            # docs/analysis_plan.md §2 (DEC-086)
  first_year: 2019                    # NCAP launched January 2019; earlier listings count from 2019
  listed_by: "06-30"                  # listed on or before 30 June -> treated that calendar year, else the next

pregate:                              # Phase 4 checks on pre-2019 data only (DEC-013, DEC-087)
  last_year: 2018                     # enforced when reading: nothing after 2018 is loaded
  first_year: 2010                    # start of the satellite analysis window
  fake_adoption_years: [2014, 2015]   # placebo-in-time
  placebo_draws: 500                  # random treated sets drawn from the control pool
  mde_multiplier: 2.8                 # z(0.975) + z(0.80): 5% two-sided, 80% power
  winter_months: [10, 11, 12, 1, 2]   # season-year t = Oct t to Feb t+1
  workers: 8                          # R parallel workers for the placebo draws
