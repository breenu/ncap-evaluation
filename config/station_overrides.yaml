      Mirror says Bihar. Operator is MPCB (Maharashtra Pollution Control Board); the OpenAQ location
      whose values are identical to this station's (5642) lies in Maharashtra, inside the
      Chhatrapati Sambhajinagar (Aurangabad, MH) urban centre.
  site_5788:
