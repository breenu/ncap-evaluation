# Corrections to CPCB mirror station metadata (src/clean/station_meta.py). Raw data are not changed.
# Each entry is a judgement from evidence, recorded with why; all are listed in
# docs/station_metadata_review.md for Reenu. Never add an entry without independent evidence.

state:
