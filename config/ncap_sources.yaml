# NCAP treatment and funding documents (Phase 2 step 5).
#
# Every document the NCAP tables are extracted from, with where it came from and what is
# read from it. `url` is the official address; `fetch` is what is actually downloaded, which
# differs only when the official file has been replaced or the site is unreachable, in which
# case an Internet Archive capture of the official URL is used (`id_` = original bytes).
# `doc_date` is the date the document states or, for undated CPCB lists, the PDF's own
# CreationDate. Pages are 1-based PDF page numbers, not printed page numbers.
#
# Parsers (src/acquire/ncap_extract.py):
#   city_list      numbered "N. City" entries, state labels detected from STATES
#   funding_table  pdfplumber tables; `columns` maps table column index -> field
#   annex_lines    text lines "<name> <numbers...>" (Finance Commission annexes); numbers
#                  are assigned from the right using `columns_from_right`
#
# Units: all amounts are Rs crore.

documents:

  # ---------------------------------------------------------------- city lists
  - id: cpcb_nac_2017
    title: "Non-Attainment cities with respect to Ambient Air Quality India (2011-2015)"
    publisher: CPCB
    doc_date: "2017-06-09"      # PDF CreationDate; pre-NCAP list
    url: http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    fetch: https://web.archive.org/web/20180516104529id_/http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    archived: "2018-05-16"
    tables:
      - {kind: city_list, pages: [1, 2], expected_count: null}

  - id: ncap_report_2019
    title: "National Clean Air Programme (NCAP), MoEFCC, January 2019; Table 4"
    publisher: MoEFCC
    doc_date: "2019-01-10"      # launch date; PDF CreationDate 2019-01-11
    url: http://moef.gov.in/wp-content/uploads/2019/05/NCAP_Report.pdf
    fetch: https://web.archive.org/web/20190711142739id_/http://moef.gov.in/wp-content/uploads/2019/05/NCAP_Report.pdf
    archived: "2019-07-11"      # moef.gov.in unreachable on 2026-09-26; URL now 404
    tables:
      - {kind: city_list, pages: [29, 30, 31, 32], expected_count: 102}

  - id: cpcb_nac_2020_06
    title: "List of 122 Non-Attainment cities"
    publisher: CPCB
    doc_date: "2020-06-04"
    url: http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    fetch: https://web.archive.org/web/20200929074113id_/http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    archived: "2020-09-29"
    tables:
      - {kind: city_list, pages: [1, 2, 3], expected_count: 122}

  - id: cpcb_nac_2020_12
    title: "List of 124 Non-Attainment cities"
    publisher: CPCB
    doc_date: "2020-12-08"
    url: http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    fetch: https://web.archive.org/web/20201210111814id_/http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    archived: "2020-12-10"
    tables:
      - {kind: city_list, pages: [1, 2, 3], expected_count: 124}

  - id: cpcb_nac_2021_06
    title: "List of 132 Non-attainment/ Million plus cities in India under NCAP"
    publisher: CPCB
    doc_date: "2021-06-18"
    url: http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    fetch: https://web.archive.org/web/20210630061920id_/http://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    archived: "2021-06-30"
    tables:
      - {kind: city_list, pages: [1, 2, 3], expected_count: 132}

  - id: cpcb_nac_2022_10
    title: "List of 131 Non-Attainment cities"
    publisher: CPCB
    doc_date: "2022-10-10"
    url: https://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf
    fetch: https://cpcb.nic.in/uploads/Non-Attainment_Cities.pdf   # live file, identical to 2023-02 capture
    tables:
      - {kind: city_list, pages: [1, 2, 3, 4], expected_count: 131}

  # ---------------------------------------------------------------- allocations
  - id: xvfc_2020_21_annex_5_3
    title: "XV Finance Commission Report for 2020-21, Annex 5.3: Grants to Million Plus Cities for 2020-21"
    publisher: Fifteenth Finance Commission
    doc_date: "2019-11-01"      # report dated November 2019 (tabled Feb 2020)
    url: https://fincomindia.nic.in/asset/pdf/commission-reports/XVFC_202021%20Report_English_Web.pdf
    fetch: https://fincomindia.nic.in/asset/pdf/commission-reports/XVFC_202021%20Report_English_Web.pdf
    tables:
      - kind: annex_lines
        pages: [105, 106]
        channel: XVFC
        columns_from_right: [total_grant_2020_21, swm_grant_2020_21, allocated_air_quality_2020_21]
        first_number: population_millions
        total_label: "Total"

  - id: xvfc_2021_26_vol2_annex_7_6
    title: "XV Finance Commission Report for 2021-26, Vol II, Annex 7.6: Grants to Million Plus Urban Agglomeration"
    publisher: Fifteenth Finance Commission
    doc_date: "2020-11-09"      # report submitted November 2020 (tabled Feb 2021)
    url: "https://fincomindia.nic.in/asset/doc/commission-reports/15th-FC/digitized/15th%20FC%20-%20Vol%20II%20-PDF.pdf"
    fetch: "https://fincomindia.nic.in/asset/doc/commission-reports/15th-FC/digitized/15th%20FC%20-%20Vol%20II%20-PDF.pdf"
    tables:
      - kind: annex_lines
        pages: [295, 296, 297]
        rotate: 90               # landscape pages; text is unreadable unless rotated
        channel: XVFC
        first_number: population_millions
        columns: [population_millions, total_grant_2021_26, swm_total_2021_26,
                  swm_2021_22, swm_2022_23, swm_2023_24, swm_2024_25, swm_2025_26,
                  allocated_air_quality_2021_26,
                  allocated_air_quality_2021_22, allocated_air_quality_2022_23,
                  allocated_air_quality_2023_24, allocated_air_quality_2024_25,
                  allocated_air_quality_2025_26]
        total_label: "Total"

  # ---------------------------------------------------------------- releases / utilisation
  - id: ls17_au5104_2022_04_04
    title: "Lok Sabha Unstarred Question 5104, answered 04.04.2022: Funds for NCAP"
    publisher: MoEFCC (Lok Sabha)
    doc_date: "2022-04-04"
    url: https://sansad.in/getFile/loksabhaquestions/annex/178/AU5104.pdf?source=pqals
    fetch: https://sansad.in/getFile/loksabhaquestions/annex/178/AU5104.pdf?source=pqals
    tables:
      - kind: funding_table
        pages: [3, 4, 5]
        channel: NCAP
        columns: {0: sno, 1: state, 2: city, 3: released_to_2021_03_31, 4: utilised_to_2022_03_30}
        total_label: "Total"
      - kind: funding_table
        pages: [8, 9]
        channel: XVFC
        # rows carry a state-level amount and a city-level amount; only the city amount is read
        columns: {4: city, 5: distributed_2021_22}
        total_label: "Total"

  - id: ls17_au2467_2022_08_01
    title: "Lok Sabha Unstarred Question 2467, answered 01.08.2022: Funds Allocated/Utilised under NCAP"
    publisher: MoEFCC (Lok Sabha)
    doc_date: "2022-08-01"
    url: https://sansad.in/getFile/loksabhaquestions/annex/179/AU2467.pdf?source=pqals
    fetch: https://sansad.in/getFile/loksabhaquestions/annex/179/AU2467.pdf?source=pqals
    tables:
      - kind: funding_table
        pages: [3, 4, 5, 6, 7, 8]
        channel: NCAP
        columns: {0: sno, 1: state, 2: city, 3: released_fy2019_20, 4: released_fy2020_21,
                  5: released_fy2021_22, 6: released_total_to_2022_06, 7: utilised_to_2022_06}
        # Utilisation is printed once per state in a merged cell, so it lands on one city's row.
        state_level_measures: [utilised_to_2022_06]
        total_label: "Total"

  - id: ls17_au164_2023_12_04
    title: "Lok Sabha Unstarred Question 164, answered 04.12.2023: Funds under National Clean Air Programme"
    publisher: MoEFCC (Lok Sabha)
    doc_date: "2023-12-04"
    url: https://sansad.in/getFile/loksabhaquestions/annex/1714/AU164.pdf?source=pqals
    fetch: https://sansad.in/getFile/loksabhaquestions/annex/1714/AU164.pdf?source=pqals
    tables:
      - {kind: city_list, pages: [3, 4, 5, 6, 7], expected_count: 131}
      - kind: funding_table
        pages: [8, 9]
        channel: XVFC
        columns: {0: state, 1: sno, 2: city, 3: allocated_fy2020_21_to_2023_24,
                  4: released_fy2020_21_to_2023_24, 5: utilised_to_2023_10}
        total_label: "Total"

  - id: ls17_au307_2024_02_05
    title: "Lok Sabha Unstarred Question 307, answered 05.02.2024: Air Quality Grant to Million Plus Cities"
    publisher: MoEFCC (Lok Sabha)
    doc_date: "2024-02-05"
    url: https://sansad.in/getFile/loksabhaquestions/annex/1715/AU307.pdf?source=pqals
    fetch: https://sansad.in/getFile/loksabhaquestions/annex/1715/AU307.pdf?source=pqals
    tables:
      - kind: funding_table
        pages: [3, 4]
        channel: XVFC
        columns: {0: sno, 1: city, 2: released_fy2020_21_to_2022_23, 3: utilised_fy2020_21_to_2022_23}
        total_label: "Total"

  - id: ls18_au2080_2024_12_09
    title: "Lok Sabha Unstarred Question 2080, answered 09.12.2024: Funds to Non-attainment Cities under NCAP"
    publisher: MoEFCC (Lok Sabha)
    doc_date: "2024-12-09"
    url: https://sansad.in/getFile/loksabhaquestions/annex/183/AU2080_TyGPws.pdf?source=pqals
    fetch: https://sansad.in/getFile/loksabhaquestions/annex/183/AU2080_TyGPws.pdf?source=pqals
    # Text: "82 non-attainment cities" + "48 Million Plus Cities" = 130 cities.
    tables:
      - kind: funding_table
        pages: [3, 4, 5, 6]
        channel: ALL
        columns: {0: state_sno, 1: state, 2: sno, 3: city, 4: released_to_fy2023_24}
        total_label: "Total"

  - id: ls18_au386_2026_02_02
    title: "Lok Sabha Unstarred Question 386, answered 02.02.2026: Performance of the National Clean Air Programme"
    publisher: MoEFCC (Lok Sabha)
    doc_date: "2026-02-02"
    url: https://sansad.in/getFile/loksabhaquestions/annex/187/AU386_8WtxTW.pdf?source=pqals
    fetch: https://sansad.in/getFile/loksabhaquestions/annex/187/AU386_8WtxTW.pdf?source=pqals
    # Text: "A total of 130 cities, including 122 non-attainment cities ... and 8 million-plus cities".
    # Only the city names in Annexure I are read (its PM10 columns are official figures, not used).
    tables:
      - {kind: city_list, pages: [3, 4, 5, 6], expected_count: 130, strip_trailing_numbers: true}
