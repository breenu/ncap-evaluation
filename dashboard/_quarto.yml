project:
  type: website
  output-dir: _site
  resources:
    # the phone charts are referenced only from a raw-HTML <source srcset>, which Quarto does not scan (DEC-205)
    - "cities/img/*-narrow.png"

website:
  title: "NCAP city explorer"
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Cities
      - href: about.qmd
        text: About the data
      - href: https://breenu.github.io/ncap-evaluation/report/report.html
        text: Report
    right:
      - href: https://github.com/breenu/ncap-evaluation
        text: Repository
      - href: https://osf.io/jksne/
        text: Pre-registration
  page-footer:
    left: "Precomputed, read-only. Not identified as effects of NCAP (registered pre-trend test failed)."
    right: "Code: MIT. Text and figures: CC BY 4.0. Ground-derived data: ODbL 1.0."

format:
  html:
    theme: cosmo
    toc: false
    lang: en
