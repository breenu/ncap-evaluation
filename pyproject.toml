# Tool configuration only; the project is not an installable package.
# The environment is defined in environment.yml / conda-lock.yml.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "env: environment smoke tests (heavy imports and R packages); slower",
    "slow: samples a PyMC model (about a minute)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` enforces line length for code; long string literals (report prose, URLs)
# are allowed rather than split mid-sentence (ruff's own advice when using the formatter).
ignore = ["E501"]
